name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Backend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Build TypeScript
        run: npx tsc -p tsconfig.build.json
      - name: Verify dist
        run: test -f dist/main.js

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://x:x@localhost:5432/x
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: unit_test_secret_32_chars_minimum_here
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage -- --config vitest.config.ts --reporter=verbose
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: warn

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mmo90s_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres_test@localhost:5432/mmo90s_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: integration_test_secret_32_chars_minimum
      NODE_ENV: test
      BCRYPT_ROUNDS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --force-reset --accept-data-loss
      - run: npx tsx prisma/seed.ts
      - run: npx vitest run --config vitest.integration.config.ts --reporter=verbose

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-build]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mmo90s_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres_e2e@localhost:5432/mmo90s_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e_test_secret_minimum_32_characters_here
      NODE_ENV: test
      BCRYPT_ROUNDS: '4'
      PORT: '4000'
      APP_URL: http://localhost:4000
      API_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:3000
      E2E_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --force-reset --accept-data-loss
      - run: npx tsx prisma/seed.ts
      - name: Build backend
        run: npx tsc -p tsconfig.build.json
      - name: Start backend and verify readiness
        run: |
          node dist/main.js > /tmp/mmo90s-e2e.log 2>&1 &
          echo $! > /tmp/mmo90s-e2e.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mmo90s-e2e.log
          exit 1
      - name: Run API E2E tests
        run: npx vitest run --config vitest.e2e.config.ts --reporter=verbose

      - name: Install frontend and Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Проверяем тот артефакт, который уезжает на прод: dev-сервер собирает
      # иначе (без минификации и с другим порядком модулей).
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend preview and verify readiness
        working-directory: frontend
        run: |
          npx vite preview --host 127.0.0.1 --port 3000 > /tmp/mmo90s-frontend.log 2>&1 &
          echo $! > /tmp/mmo90s-frontend.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mmo90s-frontend.log
          exit 1

      - name: Run Playwright visual and browser flows
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run test:visual

      - name: Upload Playwright report and visual proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-stage2-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn
          retention-days: 14
