name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: TypeScript check + Build
  # ============================================================
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Build TypeScript
        run: npx tsc -p tsconfig.build.json
      - name: Verify dist
        run: test -f dist/main.js && echo "Build OK"

  # ============================================================
  # Job 2: Unit tests (pure functions, no DB/Redis)
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://x:x@localhost:5432/x
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: unit_test_secret_32_chars_minimum_here
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Run unit tests
        run: npx vitest run --config vitest.config.ts --reporter=verbose

  # ============================================================
  # Job 3: Integration tests (PostgreSQL + Redis)
  # ============================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mmo90s_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres_test@localhost:5432/mmo90s_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: integration_test_secret_32_chars_minimum
      NODE_ENV: test
      BCRYPT_ROUNDS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --force-reset --accept-data-loss
      - run: npx tsx prisma/seed.ts
      - name: Run integration tests
        run: npx vitest run --config vitest.integration.config.ts --reporter=verbose

  # ============================================================
  # Job 4: E2E tests (full running backend)
  # Tests complete game cycle per TZ section 11
  # ============================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [typecheck-and-build]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mmo90s_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres_e2e@localhost:5432/mmo90s_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e_test_secret_minimum_32_characters_here
      NODE_ENV: test
      BCRYPT_ROUNDS: '4'
      PORT: '4000'
      APP_URL: http://localhost:4000
      API_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:3000
      E2E_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --force-reset --accept-data-loss
      - run: npx tsx prisma/seed.ts

      - name: Start backend server
        run: |
          node dist/main.js &
          echo "Backend PID: $!"
          # Wait for server to be ready
          for i in $(seq 1 30); do
            curl -s http://localhost:4000/health && break
            sleep 2
          done
        env:
          NODE_ENV: test
          JWT_SECRET: e2e_test_secret_minimum_32_characters_here

      - name: Build first (need dist)
        run: npx tsc -p tsconfig.build.json

      - name: Start backend
        run: |
          node dist/main.js &
          sleep 5
          curl -f http://localhost:4000/health
        env:
          NODE_ENV: test

      - name: Run E2E tests
        run: npx vitest run --config vitest.e2e.config.ts --reporter=verbose
        env:
          E2E_API_URL: http://localhost:4000
