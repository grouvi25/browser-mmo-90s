name: CD

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare project directory
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ${{ secrets.VPS_PROJECT_DIR }}"

      - name: Deploy code
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'SSHEOF'
            set -e
            PROJECT_DIR="${{ secrets.VPS_PROJECT_DIR }}"
            REPO="https://github.com/${{ github.repository }}.git"

            if [ -d "$PROJECT_DIR/.git" ]; then
              cd "$PROJECT_DIR"
              git fetch origin
              git reset --hard origin/main
            else
              git clone "$REPO" "$PROJECT_DIR"
              cd "$PROJECT_DIR"
            fi

            echo "Code updated: $(git log -1 --pretty='%h %s')"
          SSHEOF

      - name: Build images
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'SSHEOF'
            cd ${{ secrets.VPS_PROJECT_DIR }}
            docker compose -f docker-compose.prod.yml build 2>&1 | tail -30
          SSHEOF

      - name: Run migrations
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'SSHEOF'
            cd ${{ secrets.VPS_PROJECT_DIR }}
            docker compose -f docker-compose.prod.yml run --rm backend npx prisma migrate deploy
          SSHEOF

      - name: Seed database
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'SSHEOF'
            cd ${{ secrets.VPS_PROJECT_DIR }}
            docker compose -f docker-compose.prod.yml run --rm backend npx tsx prisma/seed.ts
          SSHEOF

      - name: Start services
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'SSHEOF'
            cd ${{ secrets.VPS_PROJECT_DIR }}
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          SSHEOF

      - name: Link nginx vhost
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'SSHEOF'
            VHOST_SRC="${{ secrets.VPS_PROJECT_DIR }}/infra/nginx/vhost-vps.conf"
            VHOST_DST="/etc/nginx/sites-enabled/mmo90s"
            if [ ! -f "$VHOST_DST" ]; then
              ln -s "$VHOST_SRC" "$VHOST_DST"
              echo "Nginx vhost linked"
            fi
            nginx -t && nginx -s reload
          SSHEOF

      - name: Health check
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'SSHEOF'
            sleep 8
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4080/health 2>/dev/null || echo "000")
            echo "Health: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Deploy successful!"
            else
              echo "Warning: health check returned $STATUS"
            fi
            docker compose -f ${{ secrets.VPS_PROJECT_DIR }}/docker-compose.prod.yml ps
          SSHEOF
