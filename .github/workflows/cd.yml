name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Ручной перевыкат. Внимание: запуск вручную не ждёт CI —
  # выкатывается указанный коммит как есть.
  workflow_dispatch:
    inputs:
      sha:
        description: 'Коммит для выката (пусто — вершина ветки запуска)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified commit to VPS
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Resolve deploy commit
        id: target
        run: |
          SHA="${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}"
          echo "Выкатываем $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check server gate
        run: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} ping

      # Сервер чужой и маленький, поэтому образы собираются здесь, а не на нём.
      # Сам выкат и откат описаны в infra/deploy/timeweb/cd-deploy.sh.
      - name: Build Docker images
        run: |
          docker build -t mmo90s-backend:incoming -f infra/docker/backend.Dockerfile ./backend
          docker build -t mmo90s-worker:incoming -f infra/docker/worker.Dockerfile ./backend
          docker build -t mmo90s-frontend:incoming --build-arg VITE_ADMIN_ORIGIN=https://admin.kooperativ.space -f infra/docker/frontend.Dockerfile ./frontend

      - name: Send images to server
        run: |
          docker save mmo90s-backend:incoming mmo90s-worker:incoming mmo90s-frontend:incoming             | gzip -1             | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} load

      - name: Deploy on server
        run: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} deploy ${{ steps.target.outputs.sha }}
