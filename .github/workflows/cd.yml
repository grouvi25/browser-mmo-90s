name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified commit to VPS
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Snapshot current commit and database
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            git rev-parse HEAD > /tmp/mmo90s_rollback_sha
            chmod +x infra/deploy/backup.sh
            ./infra/deploy/backup.sh
          EOF

      - name: Fetch verified commit
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            git fetch --prune origin
            git reset --hard "${{ github.event.workflow_run.head_sha }}"
            test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          EOF

      - name: Build Docker images
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            docker compose -f docker-compose.prod.yml build
          EOF

      - name: Run migrations
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            set -a
            . ./backend/.env
            set +a
            DIRECT_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
            docker compose -f docker-compose.prod.yml run --rm \
              -e DATABASE_URL="$DIRECT_URL" backend npx prisma migrate deploy
          EOF

      - name: Restart services
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          EOF

      - name: Verify container and public health
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            for i in $(seq 1 18); do
              if curl --fail --silent http://127.0.0.1:4080/health >/dev/null; then
                break
              fi
              if [ "$i" = 18 ]; then
                docker compose -f ${{ secrets.VPS_PROJECT_DIR }}/docker-compose.prod.yml logs --tail=100 backend
                exit 1
              fi
              sleep 5
            done
            curl --fail --silent https://game.grouvi.online/ >/dev/null
          EOF

      - name: Harden VPS and enable scheduled backups
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            chmod +x infra/deploy/backup.sh infra/deploy/harden-vps.sh
            PROJECT_DIR="${{ secrets.VPS_PROJECT_DIR }}" ./infra/deploy/harden-vps.sh
          EOF

      - name: Rollback application on failure
        if: failure()
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            ROLLBACK_SHA=$(cat /tmp/mmo90s_rollback_sha 2>/dev/null || true)
            if [ -z "$ROLLBACK_SHA" ]; then
              echo "No application rollback point is available"
              exit 1
            fi
            git reset --hard "$ROLLBACK_SHA"
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            echo "Application rolled back. Database restore remains a deliberate manual operation."
          EOF
