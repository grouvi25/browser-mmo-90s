name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Ручной перевыкат. Внимание: запуск вручную не ждёт CI —
  # выкатывается указанный коммит как есть.
  workflow_dispatch:
    inputs:
      sha:
        description: 'Коммит для выката (пусто — вершина ветки запуска)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified commit to VPS
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve deploy commit
        id: target
        run: |
          SHA="${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}"
          echo "Выкатываем $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Snapshot current commit
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            git rev-parse HEAD > /tmp/mmo90s_rollback_sha
          EOF

      - name: Fetch verified commit
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            git fetch --prune origin
            git reset --hard "${{ steps.target.outputs.sha }}"
            test "$(git rev-parse HEAD)" = "${{ steps.target.outputs.sha }}"
          EOF

      # Сборка образов на забитом диске падает на середине и оставляет
      # прод в разобранном виде. Кэш сборок чистится безопасно: образы,
      # тома и данные не затрагиваются.
      - name: Ensure free disk space on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            used() { df --output=pcent / | tail -1 | tr -dc '0-9'; }
            echo "Диск занят на $(used)%"
            if [ "$(used)" -ge 80 ]; then
              echo "Больше 80% — чистим кэш сборок Docker"
              docker builder prune -af
              echo "После чистки: $(used)%"
            fi
            if [ "$(used)" -ge 90 ]; then
              echo "Свободного места мало даже после чистки — деплой остановлен" >&2
              exit 1
            fi
          EOF

      - name: Backup database with verified deploy code
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            chmod +x infra/deploy/backup.sh
            ./infra/deploy/backup.sh
          EOF

      - name: Build Docker images
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            docker compose -f docker-compose.prod.yml build
          EOF

      - name: Run migrations
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            # backend/.env already contains the direct PostgreSQL DATABASE_URL.
            # Do not source dotenv files as shell scripts (BOM/CRLF and special values are unsafe).
            docker compose -f docker-compose.prod.yml run --rm backend npx prisma migrate deploy
          EOF

      - name: Run idempotent Stage 2 seed
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            docker compose -f docker-compose.prod.yml run --rm backend npx tsx prisma/seed.ts
          EOF

      - name: Restart services
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          EOF

      - name: Verify container and public health
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            for i in $(seq 1 18); do
              if curl --fail --silent http://127.0.0.1:4080/ready >/dev/null; then
                break
              fi
              if [ "$i" = 18 ]; then
                docker compose -f ${{ secrets.VPS_PROJECT_DIR }}/docker-compose.prod.yml logs --tail=100 backend
                exit 1
              fi
              sleep 5
            done
            curl --fail --silent https://game.grouvi.online/ >/dev/null
            curl --fail --silent https://game.grouvi.online/ready | grep -q '"status":"ready"'
          EOF

      - name: Run authenticated Stage 2 production smoke
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            SMOKE_PASSWORD="$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
            docker compose -f docker-compose.prod.yml run --rm \
              -e SMOKE_PASSWORD="$SMOKE_PASSWORD" \
              -e SMOKE_BASE_URL="https://game.grouvi.online" \
              backend node dist/scripts/production-auth-smoke.js
          EOF

      - name: Harden VPS and enable scheduled backups
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            chmod +x infra/deploy/backup.sh infra/deploy/harden-vps.sh
            PROJECT_DIR="${{ secrets.VPS_PROJECT_DIR }}" ./infra/deploy/harden-vps.sh
          EOF

      - name: Rollback application on failure
        if: failure()
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            ROLLBACK_SHA=$(cat /tmp/mmo90s_rollback_sha 2>/dev/null || true)
            if [ -z "$ROLLBACK_SHA" ]; then
              echo "No application rollback point is available"
              exit 1
            fi
            git reset --hard "$ROLLBACK_SHA"
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            echo "Application rolled back. Database restore remains a deliberate manual operation."
          EOF
