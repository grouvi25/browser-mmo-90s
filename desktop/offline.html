<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title>Кооператив</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #faeadd; color: #17130f; font: 16px/1.5 system-ui, sans-serif; }
  main { text-align: center; padding: 24px; border: 2px solid #17130f; background: #fffdf8; max-width: 420px; }
  h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: .04em; text-transform: uppercase; }
  p { margin: 0 0 18px; }
  button { min-height: 44px; padding: 0 22px; border: 2px solid #17130f; background: #ab0303; color: #fff; font: 700 15px system-ui, sans-serif; text-transform: uppercase; cursor: pointer; }
  button:hover { background: #8c0202; }
  button:focus-visible { outline: 3px solid #17130f; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Нет связи</h1>
  <p>Не получается открыть игру. Проверьте интернет и попробуйте еще раз.</p>
  <button type="button" id="retry">Повторить</button>
</main>
<script>
  const back = new URLSearchParams(location.search).get('back') || 'https://kooperativ.space/'
  const go = () => { location.href = back.startsWith('https://kooperativ.space') ? back : 'https://kooperativ.space/' }
  document.getElementById('retry').addEventListener('click', go)
  window.addEventListener('online', go)
</script>
</body>
</html>
