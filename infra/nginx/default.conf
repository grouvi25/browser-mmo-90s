server {
    listen 80;
    server_name _;

    # -- Security headers --
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # -- Frontend static --
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # -- Backend REST API --
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        # Timeouts for long-running requests
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # Rate limiting zone (defined below)
        limit_req zone=api_limit burst=30 nodelay;
    }

    # -- Socket.io WebSocket (realtime battles, chat) --
    # IMPORTANT: Socket.io uses long polling as fallback.
    # Both HTTP and WS upgrades must be proxied to the same upstream.
    location /socket.io/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket keepalive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # -- Health check endpoint --
    location /health {
        proxy_pass http://backend_pool;
        access_log off;
    }

    # -- Rate limiting zones --
    # 100 req/s per IP for API (burst 30)
    # Adjust as needed per load testing
}

# Define rate limit zone at http context level (include in nginx.conf)
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
