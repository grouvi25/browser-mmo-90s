# /etc/nginx/nginx.conf — production optimized for game.grouvi.online
# Apply on VPS: sudo nginx -t && sudo nginx -s reload

user nginx;
worker_processes auto;          # = number of CPU cores
worker_rlimit_nofile 65535;     # file descriptors per worker
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;    # connections per worker (total = workers × 4096)
    use epoll;                  # fastest Linux I/O multiplexer
    multi_accept on;            # accept all pending connections at once
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging — real IP from Cloudflare
    log_format main '$http_cf_connecting_ip - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # TCP performance
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # Upstream keepalive pool — reuse connections to Node.js
    upstream backend {
        server 127.0.0.1:4080;
        keepalive 32;           # 32 persistent connections to Node.js
    }

    upstream frontend {
        server 127.0.0.1:3080;
        keepalive 16;
    }

    # Buffer sizes
    client_body_buffer_size    16k;
    client_header_buffer_size   4k;
    client_max_body_size        2m;
    large_client_header_buffers 4 8k;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
