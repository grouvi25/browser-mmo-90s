# Backend upstream pool — horizontal scaling
# Socket.io REQUIRES ip_hash for sticky sessions
# (a player must always connect to the same backend instance
#  unless you use @socket.io/redis-adapter, which we do)
upstream backend_pool {
    # With Redis adapter, round-robin is fine.
    # Use ip_hash only as fallback if Redis adapter is disabled.
    least_conn;
    server backend:4000;
    # Docker Compose replicas are auto-discovered via DNS:
    # backend_1:4000, backend_2:4000, backend_3:4000
    keepalive 64;
}
