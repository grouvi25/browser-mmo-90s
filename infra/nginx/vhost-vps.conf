# ── Пределы по адресу клиента (28.10, защита от ботов и флуда) ─────
# Первая линия до Node: дешёвый отказ ещё в nginx. Пределы с запасом —
# мобильные операторы сажают многих игроков за один адрес. Точные пределы
# по смыслу (регистрация, вход, чат) держит сам сервер игры.
limit_req_zone  $binary_remote_addr zone=koop_api:20m  rate=20r/s;
limit_req_zone  $binary_remote_addr zone=koop_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=koop_conn:10m;

server {
    # Оба порта в одном блоке.
    #
    # Cloudflare в режиме Flexible ходит на origin по 80, в режимах Full и
    # Full (strict) — по 443. Раньше блок слушал только 80, поэтому после
    # переключения режима запрос к kooperativ.space попадал в первый
    # попавшийся 443-сервер на хосте и домен отдавал чужое приложение.
    # Слушая оба порта, vhost работает при любом режиме Cloudflare.
    #
    # Порт 80 нужен ещё и для ACME-проверки при продлении сертификата.
    listen 80;
    listen 443 ssl;
    server_name kooperativ.space www.kooperativ.space;

    ssl_certificate     /etc/letsencrypt/live/kooperativ.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kooperativ.space/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Cloudflare real IP passthrough
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;

    # ── Performance tweaks ─────────────────────────────────────
    # Keep connections alive to upstream (reduces TCP overhead)
    # proxy_http_version 1.1 enables keep-alive to backend
    # Frontend (React SPA) with static bundle caching.
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_cache_valid 200 1h;
    }

    limit_req_status  429;
    limit_conn_status 429;

    # Вход, регистрация, восстановление пароля — отдельно и строже.
    location /api/auth/ {
        limit_req zone=koop_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:4080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        # Адрес клиента — перезаписью, а не дописыванием к присланному:
        # $proxy_add_x_forwarded_for сохранял заголовок клиента, и подставной
        # адрес в нём обнулял пределы по IP (28.10).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Панель управления живёт на admin.kooperativ.space (vhost-admin.conf),
    # с основного домена её API закрыт.
    location /api/admin/ {
        return 404;
    }

    # Backend REST API — keepalive upstream
    location /api/ {
        limit_req zone=koop_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:4080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # keep-alive to upstream
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        # Buffer responses to free upstream quickly
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
    }

    # Socket.io WebSocket — no buffering, long timeout
    location /socket.io/ {
        # Вкладок у игрока немного; сотни соединений с адреса — это бот.
        limit_conn koop_conn 20;
        limit_req zone=koop_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:4080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check — fast path, no log
    location ~ ^/(health|ready)$ {
        proxy_pass http://127.0.0.1:4080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain;
}
