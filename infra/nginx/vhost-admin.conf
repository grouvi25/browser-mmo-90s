# ── Панель управления на поддомене admin.kooperativ.space (30.10) ──────
# Сертификат выпущен через webroot (/var/www/certbot), продлевает certbot
# по таймеру. CD подключает файл рядом с vhost-vps.conf. На основном домене
# /api/admin/ закрыт, а /admin уводит сюда (VITE_ADMIN_ORIGIN в сборке).
server {
    listen 80;
    server_name admin.kooperativ.space;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name admin.kooperativ.space;

    ssl_certificate     /etc/letsencrypt/live/admin.kooperativ.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.kooperativ.space/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Панель не должна попадать в поиск.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Тот же фронт, что и у игры: на хосте admin. он сразу открывает панель.
    location /api/ {
        limit_req zone=koop_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:4080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Адрес клиента — перезаписью, как в vhost-vps.conf.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
